<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151a" />
    <meta
      name="description"
      content="Mavero — a premium boutique for the discerning. Shop curated luxury essentials."
    />
    <title>Mavero | Premium Boutique</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("mavero-theme");
          var isDark =
            saved === "dark" ||
            (!saved &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");

          var savedLang = localStorage.getItem("mavero-language") || "en";
          var rtlLangs = ["ar", "ur"];
          document.documentElement.lang = savedLang;
          document.documentElement.dir = rtlLangs.indexOf(savedLang) !== -1 ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
